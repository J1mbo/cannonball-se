# 50-cannonball-audio.conf
#
# PAM limits file for CannonBall-SE's real-time audio scheduling (see
# tools/AUDIO_PERF_PLAN.md, stage R2). Without this, pthread_setschedparam()
# on the mix and SDL audio threads fails with EPERM and the game silently
# falls back to normal (CFS) scheduling - audio still works, but is exposed
# to scheduling jitter that can underrun on loaded single/dual-core boards
# (e.g. Raspberry Pi 2).
#
# Install with:
#   sudo cp res/50-cannonball-audio.conf /etc/security/limits.d/
# (install.sh does this automatically.) Takes effect at the next login
# (pam_limits), so log out/in (or reboot) before expecting SCHED_FIFO to be
# granted.
#
# Grants members of the 'audio' group permission to request real-time
# (SCHED_FIFO/SCHED_RR) priority up to 80, and to lock memory. CannonBall-SE
# only ever requests priority 50 (mix thread) and 55 (SDL audio thread) -
# well under this ceiling - and only on its own two self-throttling audio
# threads.
#
# If your run user isn't in the 'audio' group, either add it
# (sudo usermod -aG audio <user>) or replace '@audio' below with the
# username directly.

@audio   -   rtprio      80
@audio   -   nice       -20
@audio   -   memlock     unlimited
